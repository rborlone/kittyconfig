# Sesión "Ops": terminal + monitoreo en una sola ventana de Kitty.
#
# Abrir:
#   ctrl+shift+o                                   (atajo definido en kitty.conf)
#   kitty --session ~/.config/kitty/custom.conf    (desde cualquier terminal)
#
# Tab "Ops" (layout splits):
#   ┌──────────────┬──────────────┐
#   │              │ finops (55%) │
#   │              ├──────────────┤
#   │ shell        │ htop   (23%) │
#   │              ├──────────────┤
#   │              │ k8s-htop(22%)│
#   └──────────────┴──────────────┘
#
# --hold deja un prompt de shell si el programa termina (q), en vez de cerrar el panel.
# Rutas absolutas: la sesión no depende de que ~/.local/bin esté en el PATH.

new_tab Ops
layout splits
cd ~

launch --title shell --var pane=shell
launch --hold --title finops --var pane=finops --location=vsplit /Users/rborlone/.local/bin/finops
# Alturas dispares: finops exige 20 filas mínimo (k8s-htop 8, htop ninguno).
# --bias es el % del panel partido que se lleva el nuevo: finops ~55%, htop ~23%, k8s-htop ~22%.
launch --hold --title htop --var pane=htop --location=hsplit --bias=45 --next-to var:pane=finops /opt/homebrew/bin/htop
launch --hold --title k8s-htop --var pane=k8s --location=hsplit --bias=49 --next-to var:pane=htop /Users/rborlone/Proyectos/k8s-htop/k8s-htop

focus_matching_window var:pane=shell
